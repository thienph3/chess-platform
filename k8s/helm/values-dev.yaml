namespace: chess-platform

tolerations:
- key: "vnm-aws-data-machine-pool"
  operator: "Equal"
  value: "general-pool"
  effect: "NoSchedule"
- key: "vnm-aws-data-machine-pool"
  operator: "Equal"
  value: "compute-pool"
  effect: "NoSchedule"

backend:
  replicaCount: 1
  serviceLabel: chess-backend
  image:
    repository: 783163248618.dkr.ecr.ap-southeast-1.amazonaws.com/chess-platform/backend
    tag: latest
  service:
    type: ClusterIP
    port: 80
  ingress:
    host: dev-ml.tech.vinamilklocal.com
    path: /chess/api
    pathType: Prefix
  cpu: 100m
  memory: 256Mi
  cpuLimit: "2"
  memoryLimit: 2Gi
  env:
    DEBUG: "true"
    SECRET_KEY: "dev-secret-key-change-in-production"
    ANALYSIS_CHESS_URL: "http://chess-analysis-service.chess-platform.svc.cluster.local:8001"
    ANALYSIS_XIANGQI_URL: "http://chess-xiangqi-service.chess-platform.svc.cluster.local:8002"
    ANALYSIS_GO_URL: "http://chess-go-service.chess-platform.svc.cluster.local:8003"
    ANALYSIS_GOMOKU_URL: "http://chess-gomoku-service.chess-platform.svc.cluster.local:8004"
  secrets:
    - name: DATABASE_HOST
      secretName: chess-platform-secret
      secretKey: db-host
    - name: DATABASE_PORT
      secretName: chess-platform-secret
      secretKey: db-port
    - name: DATABASE_USER
      secretName: chess-platform-secret
      secretKey: db-username
    - name: DATABASE_PASSWORD
      secretName: chess-platform-secret
      secretKey: db-password
    - name: DATABASE_NAME
      secretName: chess-platform-secret
      secretKey: db-name

frontend:
  replicaCount: 1
  serviceLabel: chess-frontend
  image:
    repository: 783163248618.dkr.ecr.ap-southeast-1.amazonaws.com/chess-platform/frontend
    tag: latest
  service:
    type: ClusterIP
    port: 80
  ingress:
    host: dev-ml.tech.vinamilklocal.com
    path: /chess
    pathType: Prefix
  cpu: 50m
  memory: 128Mi
  cpuLimit: "1"
  memoryLimit: 512Mi
  env:
    BACKEND_HOST: "chess-backend-service"

analysisChess:
  replicaCount: 1
  serviceLabel: chess-analysis
  image:
    repository: 783163248618.dkr.ecr.ap-southeast-1.amazonaws.com/chess-platform/analysis-chess
    tag: latest
  service:
    type: ClusterIP
    port: 8001
  cpu: 200m
  memory: 512Mi
  cpuLimit: "2"
  memoryLimit: 2Gi
  env:
    STOCKFISH_PATH: "/usr/games/stockfish"

analysisGomoku:
  replicaCount: 1
  serviceLabel: chess-gomoku
  image:
    repository: 783163248618.dkr.ecr.ap-southeast-1.amazonaws.com/chess-platform/analysis-gomoku
    tag: latest
  service:
    type: ClusterIP
    port: 8004
  cpu: 100m
  memory: 256Mi
  cpuLimit: "2"
  memoryLimit: 1Gi
  env:
    RAPFI_PATH: "/usr/local/bin/rapfi"
